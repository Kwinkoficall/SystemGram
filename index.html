<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Giftgram</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0e0f12; --card:rgba(255,255,255,.06); --line:rgba(255,255,255,.09);
  --txt:#f2f3f5; --sub:#8b8f98; --acc:#7c8cff; --acc2:#b07cff;
  --common:#8b8f98; --rare:#4da3ff; --epic:#b07cff; --legend:#ffb04d;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
  font-family:-apple-system,"SF Pro Text",Roboto,"Segoe UI",sans-serif;overflow:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:0;
  background:radial-gradient(40% 30% at 20% 10%,rgba(124,140,255,.18),transparent 70%),
             radial-gradient(40% 30% at 85% 90%,rgba(176,124,255,.14),transparent 70%)}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px}
.bal{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);
  padding:7px 12px;border-radius:999px;font-weight:600;font-size:14px}
main{flex:1;overflow-y:auto;padding:0 14px 90px}
.glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:18px}
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:calc(100% - 24px);max-width:536px;
  display:flex;padding:6px;gap:4px;z-index:5}
nav button{flex:1;background:none;border:0;color:var(--sub);padding:9px 0 7px;border-radius:14px;font-size:11px;cursor:pointer}
nav button span{display:block;font-size:20px;margin-bottom:2px}
nav button.on{background:rgba(255,255,255,.09);color:var(--txt)}
.row{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;cursor:pointer}
.ava{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;background:linear-gradient(135deg,var(--acc),var(--acc2));flex:none}
.row .t{font-weight:600}.row .s{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gift{padding:14px 10px;text-align:center;position:relative}
.gift .e{font-size:54px;line-height:1.1;margin:6px 0}
.gift .n{font-weight:600;font-size:14px}
.gift .m{font-size:12px;color:var(--sub);margin:2px 0 8px}
.btn{background:linear-gradient(135deg,var(--acc),var(--acc2));border:0;color:#fff;font-weight:600;
  padding:9px 14px;border-radius:12px;cursor:pointer;font-size:14px;width:100%}
.btn.ghost{background:rgba(255,255,255,.08)}
.btn:disabled{opacity:.4}
.tag{position:absolute;top:8px;left:8px;font-size:10px;padding:3px 7px;border-radius:999px;background:rgba(0,0,0,.35);font-weight:700}
.r-common{color:var(--common)}.r-rare{color:var(--rare)}.r-epic{color:var(--epic)}.r-legendary{color:var(--legend)}
.nft{outline:1.5px solid var(--acc2)}
h3{margin:14px 4px 8px;font-size:15px;color:var(--sub);font-weight:600}
/* chat */
#chat{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column;max-width:560px;margin:0 auto}
#chat.open{display:flex}
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.chead .back{background:none;border:0;color:var(--txt);font-size:22px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.msg{max-width:78%;padding:9px 12px;border-radius:16px;font-size:15px;line-height:1.35;word-wrap:break-word}
.msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--acc),var(--acc2))}
.msg.him{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg .tm{font-size:10px;opacity:.6;text-align:right;margin-top:2px}
.gmsg{align-self:center;text-align:center;padding:14px 22px;margin:6px 0}
.gmsg .e{font-size:64px}.gmsg .c{font-size:13px;color:var(--sub);margin-top:4px}
.cbar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.cbar input{flex:1;background:var(--card);border:1px solid var(--line);color:var(--txt);padding:11px 14px;border-radius:14px;font-size:15px;outline:none}
.cbar button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:14px;width:46px;font-size:20px;cursor:pointer}
/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:none;background:rgba(0,0,0,.55);align-items:flex-end}
#sheet.open{display:flex}
#sheet .in{width:100%;max-width:560px;margin:0 auto;background:#16181d;border-radius:22px 22px 0 0;padding:16px;max-height:75vh;overflow-y:auto;border:1px solid var(--line)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:50;padding:10px 16px;border-radius:14px;
  background:#1d2026;border:1px solid var(--line);font-size:14px;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1}
.big{font-size:90px;text-align:center;margin:6px 0}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:first-child{color:var(--sub)}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">Чаты</h1><div class="bal" id="bal">⭐ 0</div></header>
  <main id="main"></main>
  <nav class="glass">
    <button data-t="chats"><span>💬</span>Чаты</button>
    <button data-t="shop"><span>🎁</span>Подарки</button>
    <button data-t="coll"><span>🗂</span>Коллекция</button>
    <button data-t="prof"><span>👤</span>Профиль</button>
  </nav>
</div>

<div id="chat">
  <div class="chead"><button class="back" id="cback">‹</button><div class="ava" id="cava"></div>
    <div><div style="font-weight:600" id="cname"></div><div style="font-size:12px;color:var(--sub)">в сети</div></div></div>
  <div id="msgs"></div>
  <div class="cbar"><button id="cgift">🎁</button><input id="cin" placeholder="Сообщение" autocomplete="off"><button id="csend">➤</button></div>
</div>
<div id="sheet"><div class="in" id="sin"></div></div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor('#0e0f12'); tg.setBackgroundColor('#0e0f12'); }catch(e){} }
const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;

/* ---------- Каталог подарков ---------- */
const GIFTS = [
  {id:'heart',  name:'Сердце',        e:'💖', price:25,   rar:'common',    supply:0},
  {id:'bear',   name:'Мишка',         e:'🧸', price:60,   rar:'common',    supply:0},
  {id:'rose',   name:'Роза',          e:'🌹', price:100,  rar:'rare',      supply:50000},
  {id:'cake',   name:'Торт',          e:'🎂', price:150,  rar:'rare',      supply:30000},
  {id:'rocket', name:'Ракета',        e:'🚀', price:400,  rar:'epic',      supply:10000},
  {id:'crown',  name:'Корона',        e:'👑', price:1200, rar:'epic',      supply:3000},
  {id:'diamond',name:'Бриллиант',     e:'💎', price:5000, rar:'legendary', supply:500},
  {id:'dragon', name:'Дракон',        e:'🐉', price:15000,rar:'legendary', supply:100},
];
const MODELS = ['Классика','Неон','Золото','Лёд','Тень','Радуга'];
const BGS = ['#2b2f4a','#3a2b4a','#2b4a3e','#4a3a2b','#2b3f4a','#4a2b36'];
const CONTACTS = [
  {id:1,name:'Алексей',ava:'😎',bot:['Привет!','Ого, круто 🔥','Давай позже','Класс','Согласен']},
  {id:2,name:'Марина',ava:'🌸',bot:['Привет ☺️','Спасибо!','Ахах','Расскажи ещё','Ты где?']},
  {id:3,name:'Команда',ava:'👥',bot:['Принято','Сделаем','Ок','Обсудим завтра','Супер']},
  {id:4,name:'Giftgram',ava:'🎁',bot:['Добро пожаловать! Подарки можно отправлять прямо в чате.']},
];

/* ---------- Состояние ---------- */
const KEY = 'giftgram_v1';
let S = JSON.parse(localStorage.getItem(KEY) || 'null') || {
  bal: 2000, nextId: 1, owned: [], chats: {}, sold: {}
};
const save = () => localStorage.setItem(KEY, JSON.stringify(S));
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => n.toLocaleString('ru-RU');
const hm = t => new Date(t).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
const gift = id => GIFTS.find(g => g.id === id);
const RAR = {common:'Обычный',rare:'Редкий',epic:'Эпический',legendary:'Легендарный'};

function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); setTimeout(()=>el.classList.remove('on'),1800); }
function haptic(k='light'){ try{ tg.HapticFeedback.impactOccurred(k);}catch(e){} }

/* ---------- Покупка / отправка ---------- */
function mintGift(g){
  const sold = S.sold[g.id] = (S.sold[g.id]||0) + 1;
  const num = g.supply ? Math.min(sold, g.supply) : sold;
  return { uid:S.nextId++, gid:g.id, num, model:MODELS[Math.random()*MODELS.length|0],
           bg:BGS[Math.random()*BGS.length|0], nft:false, t:Date.now() };
}
function buy(gid){
  const g = gift(gid);
  if (S.bal < g.price) { toast('Не хватает ⭐'); return null; }
  S.bal -= g.price;
  const item = mintGift(g); S.owned.push(item); save(); renderBal(); haptic('medium');
  return item;
}
function addMsg(cid, m){ (S.chats[cid] = S.chats[cid] || []).push(Object.assign({t:Date.now()}, m)); save(); }

/* ---------- Экраны ---------- */
let tab = 'chats', curChat = null;
const TITLES = {chats:'Чаты',shop:'Подарки',coll:'Коллекция',prof:'Профиль'};
function renderBal(){ $('#bal').textContent = '⭐ ' + fmt(S.bal); }

function render(){
  $('#title').textContent = TITLES[tab]; renderBal();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const m = $('#main');
  if (tab==='chats') m.innerHTML = CONTACTS.map(c => {
      const last = (S.chats[c.id]||[]).slice(-1)[0];
      const txt = !last ? 'Нет сообщений' : last.gift ? '🎁 Подарок' : esc(last.text);
      return `<div class="row glass" data-c="${c.id}"><div class="ava">${c.ava}</div>
        <div><div class="t">${c.name}</div><div class="s">${txt}</div></div></div>`;
    }).join('');
  if (tab==='shop') m.innerHTML = '<div class="grid">' + GIFTS.map(g => `
      <div class="gift glass">
        <div class="tag r-${g.rar}">${RAR[g.rar]}</div>
        <div class="e">${g.e}</div><div class="n">${g.name}</div>
        <div class="m">${g.supply ? 'Тираж: '+fmt(g.supply)+' · продано '+fmt(S.sold[g.id]||0) : 'Без лимита'}</div>
        <button class="btn" data-buy="${g.id}">⭐ ${fmt(g.price)}</button></div>`).join('') + '</div>';
  if (tab==='coll') {
    if (!S.owned.length) m.innerHTML = '<div style="text-align:center;color:var(--sub);margin-top:60px">Пока пусто.<br>Купите подарок во вкладке «Подарки».</div>';
    else m.innerHTML = '<div class="grid">' + S.owned.slice().reverse().map(o => {
        const g = gift(o.gid);
        return `<div class="gift glass ${o.nft?'nft':''}" data-o="${o.uid}" style="background:linear-gradient(160deg,${o.bg},rgba(255,255,255,.04))">
          ${o.nft?'<div class="tag" style="color:var(--acc2)">NFT</div>':''}
          <div class="e">${g.e}</div><div class="n">${g.name}</div>
          <div class="m">#${fmt(o.num)}${g.supply?' из '+fmt(g.supply):''} · ${o.model}</div></div>`; }).join('') + '</div>';
  }
  if (tab==='prof') {
    const name = tgUser ? [tgUser.first_name,tgUser.last_name].filter(Boolean).join(' ') : 'Гость';
    const worth = S.owned.reduce((a,o)=>a+gift(o.gid).price,0);
    m.innerHTML = `<div class="glass" style="padding:20px;text-align:center"><div class="ava" style="margin:0 auto 10px;width:70px;height:70px;font-size:32px">🙂</div>
      <div style="font-size:18px;font-weight:700">${esc(name)}</div>
      ${tgUser&&tgUser.username?'<div style="color:var(--sub)">@'+esc(tgUser.username)+'</div>':''}</div>
      <div class="glass" style="padding:6px 16px;margin-top:10px">
        <div class="kv"><span>Подарков</span><span>${S.owned.length}</span></div>
        <div class="kv"><span>NFT</span><span>${S.owned.filter(o=>o.nft).length}</span></div>
        <div class="kv"><span>Стоимость коллекции</span><span>⭐ ${fmt(worth)}</span></div></div>
      <button class="btn ghost" style="margin-top:12px" id="topup">+ 1000 ⭐ (тестовое пополнение)</button>
      <button class="btn ghost" style="margin-top:8px" id="reset">Сбросить данные</button>`;
  }
}

/* ---------- Чат ---------- */
function openChat(id){
  curChat = CONTACTS.find(c => c.id == id);
  $('#cava').textContent = curChat.ava; $('#cname').textContent = curChat.name;
  $('#chat').classList.add('open'); drawMsgs();
  if (tg) { tg.BackButton.show(); }
}
function closeChat(){ $('#chat').classList.remove('open'); curChat = null; if (tg) tg.BackButton.hide(); render(); }
function drawMsgs(){
  const box = $('#msgs'); const list = S.chats[curChat.id] || [];
  box.innerHTML = list.map(m => {
    if (m.gift){ const g = gift(m.gift.gid);
      return `<div class="gmsg glass" style="background:linear-gradient(160deg,${m.gift.bg},rgba(255,255,255,.04))">
        <div class="e">${g.e}</div><div style="font-weight:600">${g.name} #${fmt(m.gift.num)}</div>
        <div class="c">${m.me ? 'Вы отправили подарок' : curChat.name+' отправил(а) вам подарок'}</div></div>`; }
    return `<div class="msg ${m.me?'me':'him'}">${esc(m.text)}<div class="tm">${hm(m.t)}</div></div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}
function send(){
  const v = $('#cin').value.trim(); if (!v || !curChat) return;
  addMsg(curChat.id, {me:true, text:v}); $('#cin').value=''; drawMsgs();
  const c = curChat;
  setTimeout(() => { addMsg(c.id, {text:c.bot[Math.random()*c.bot.length|0]}); if (curChat && curChat.id===c.id) drawMsgs(); }, 900);
}
function sendGiftSheet(){
  $('#sin').innerHTML = '<h3 style="margin-top:0">Отправить подарок</h3>' +
    (S.owned.length ? '<div class="grid">' + S.owned.map(o => { const g=gift(o.gid);
      return `<div class="gift glass" data-send="${o.uid}"><div class="e" style="font-size:40px">${g.e}</div><div class="n">${g.name}</div><div class="m">#${fmt(o.num)}</div></div>`;}).join('') + '</div>'
      : '<div style="color:var(--sub)">В коллекции пусто.</div>') +
    '<h3>Купить и отправить</h3><div class="grid">' + GIFTS.slice(0,4).map(g =>
      `<div class="gift glass" data-bsend="${g.id}"><div class="e" style="font-size:40px">${g.e}</div><div class="n">${g.name}</div><div class="m">⭐ ${fmt(g.price)}</div></div>`).join('') + '</div>';
  $('#sheet').classList.add('open');
}
function doSend(item){
  S.owned = S.owned.filter(o => o.uid !== item.uid);
  addMsg(curChat.id, {me:true, gift:item}); save();
  $('#sheet').classList.remove('open'); drawMsgs(); renderBal(); haptic('heavy');
  const c = curChat;
  setTimeout(()=>{ addMsg(c.id,{text:'Спасибо за подарок! 😍'}); if(curChat&&curChat.id===c.id) drawMsgs(); }, 1100);
}

/* ---------- Карточка подарка из коллекции ---------- */
function openItem(uid){
  const o = S.owned.find(x => x.uid == uid); if(!o) return; const g = gift(o.gid);
  const sell = Math.round(g.price * 0.8);
  $('#sin').innerHTML = `<div class="big">${g.e}</div>
    <div style="text-align:center;font-size:18px;font-weight:700">${g.name} #${fmt(o.num)}</div>
    <div style="text-align:center" class="r-${g.rar}">${RAR[g.rar]}</div>
    <div style="margin:12px 0">
      <div class="kv"><span>Модель</span><span>${o.model}</span></div>
      <div class="kv"><span>Фон</span><span style="color:${o.bg};filter:brightness(2)">${o.bg}</span></div>
      <div class="kv"><span>Номер</span><span>#${fmt(o.num)}${g.supply?' из '+fmt(g.supply):''}</span></div>
      <div class="kv"><span>Статус</span><span>${o.nft?'NFT':'Внутри приложения'}</span></div></div>
    ${o.nft ? '' : `<button class="btn" data-mint="${o.uid}">Превратить в NFT (демо)</button>`}
    <button class="btn ghost" style="margin-top:8px" data-sell="${o.uid}">Продать за ⭐ ${fmt(sell)}</button>`;
  $('#sheet').classList.add('open');
}

/* ---------- События ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('*'); if (!t) return;
  const nb = e.target.closest('nav button'); if (nb){ tab = nb.dataset.t; render(); return; }
  const c = e.target.closest('[data-c]'); if (c){ openChat(c.dataset.c); return; }
  const b = e.target.closest('[data-buy]'); if (b){ const it = buy(b.dataset.buy); if(it){ toast('Куплено: '+gift(it.gid).name+' #'+it.num); render(); } return; }
  const o = e.target.closest('[data-o]'); if (o){ openItem(o.dataset.o); return; }
  const s = e.target.closest('[data-send]'); if (s){ doSend(S.owned.find(x=>x.uid==s.dataset.send)); return; }
  const bs = e.target.closest('[data-bsend]'); if (bs){ const it = buy(bs.dataset.bsend); if(it) doSend(it); return; }
  const mi = e.target.closest('[data-mint]'); if (mi){ const it = S.owned.find(x=>x.uid==mi.dataset.mint); it.nft = true; save(); toast('Подарок отмечен как NFT (демо)'); $('#sheet').classList.remove('open'); render(); return; }
  const se = e.target.closest('[data-sell]'); if (se){ const it = S.owned.find(x=>x.uid==se.dataset.sell); S.bal += Math.round(gift(it.gid).price*0.8); S.owned = S.owned.filter(x=>x!==it); save(); $('#sheet').classList.remove('open'); toast('Продано'); render(); return; }
  if (e.target.id === 'sheet') $('#sheet').classList.remove('open');
  if (e.target.id === 'topup'){ S.bal += 1000; save(); render(); }
  if (e.target.id === 'reset'){ if (confirm('Удалить все данные?')){ localStorage.removeItem(KEY); location.reload(); } }
});
$('#cback').onclick = closeChat;
$('#csend').onclick = send;
$('#cin').addEventListener('keydown', e => { if (e.key==='Enter') send(); });
$('#cgift').onclick = sendGiftSheet;
if (tg) tg.BackButton.onClick(closeChat);

render();
</script>
</body>
</html>
